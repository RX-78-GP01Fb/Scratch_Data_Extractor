<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><title>Scratch Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#008080] p-4 text-xs font-mono">
    <div class="win-outset p-3 max-w-md mx-auto">
        <h1 class="bg-blue-800 text-white p-1 font-bold">Scratch Extractor</h1>
        <div class="my-2">
            <input id="studioId" class="win-inset p-1 w-full text-black" placeholder="スタジオID">
            <button onclick="start()" class="win-btn mt-2 w-full">取得開始</button>
        </div>
        <div class="win-inset bg-white p-2 h-48 overflow-auto text-black">
            <table class="w-full retro-table">
                <thead><tr><th>操作</th><th>ユーザー</th><th>対象</th></tr></thead>
                <tbody id="log"></tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
